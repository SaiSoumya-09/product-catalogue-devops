apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalogue-v2
  namespace: v2
  labels:
    app: product-catalogue-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-catalogue-v2
  template:
    metadata:
      labels:
        app: product-catalogue-v2
    spec:
      containers:
        - name: product-catalogue
          image: product-catalogue:v2.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 9191
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://task2-mysql.default.svc.cluster.local:3306/javatechie
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"