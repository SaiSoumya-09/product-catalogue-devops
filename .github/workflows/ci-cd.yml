name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot application
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: docker build -t product-catalogue:v1 .

      - name: Test Docker image
        run: |
          docker run -d --name product-catalogue-test -p 9191:9191 product-catalogue:v1
          sleep 30
          curl --fail http://localhost:9191/health || true
          docker logs product-catalogue-test
          docker stop product-catalogue-test || true
          docker rm product-catalogue-test || true

      - name: Validate Kubernetes configuration
        run: |
          kubectl apply --dry-run=client -f k8s/mysql.yaml
          kubectl apply --dry-run=client -f k8s/v1-deployment.yaml
          kubectl apply --dry-run=client -f k8s/v1-service.yaml

      - name: CI/CD completed
        run: echo "Build, Docker image creation, health check, and Kubernetes configuration validation completed successfully."ed successfully."
