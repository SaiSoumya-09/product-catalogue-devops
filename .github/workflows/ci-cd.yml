name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot application
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: docker build -t product-catalogue:v1.

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Load Docker image into Minikube
        run: minikube image load product-catalogue:v1.

      - name: Deploy Kubernetes application
        run: |
          kubectl apply -f k8s/mysql.yaml
          kubectl apply -f k8s/v1-deployment.yaml
          kubectl apply -f k8s/v1-service.yaml

      - name: Check deployment
        run: |
          kubectl rollout status deployment/product-catalogue-v1 --timeout=120s
          kubectl get pods
          kubectl get services